apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if .Values.storage.size }}
  # A disk can only be attached to one copy at a time: stop the old one before starting the new.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      {{- if .Values.secrets }}
      annotations:
        # Restart the app when its secrets change.
        checksum/secrets: {{ toYaml .Values.secrets | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image }}:{{ .Values.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.secrets }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          {{- end }}
          {{- with .Values.healthPath }}
          readinessProbe:
            httpGet:
              path: {{ . }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ . }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.storage.size }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.storage.mountPath }}
          {{- end }}
      {{- if .Values.storage.size }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
      {{- end }}
