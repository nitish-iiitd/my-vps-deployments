{{- if .Values.secrets }}
# Encrypted values; only this cluster's Sealed Secrets controller can decrypt them
# into a normal Secret named <app>-secrets.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-secrets
spec:
  encryptedData:
    {{- toYaml .Values.secrets | nindent 4 }}
  template:
    metadata:
      name: {{ .Release.Name }}-secrets
{{- end }}
