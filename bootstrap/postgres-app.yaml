apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: postgresql
      targetRevision: "*"
      helm:
        releaseName: postgres
        valueFiles:
          - $values/databases/postgres-values.yaml

    - repoURL: https://github.com/nitish-iiitd/my-vps-deployments.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: db

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true