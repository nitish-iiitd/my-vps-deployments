apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-tempo
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        releaseName: tempo
        valueFiles:
          - $values/observability/tempo-values.yaml
    - repoURL: https://github.com/nitish-iiitd/my-vps-deployments.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: obs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true