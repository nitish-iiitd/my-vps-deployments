apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-prometheus
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.5.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/observability/prometheus-values.yaml
    - repoURL: https://github.com/nitish-iiitd/my-vps-deployments.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: obs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true