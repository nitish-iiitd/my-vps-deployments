apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dutchr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nitish-iiitd/dutchr.git
    targetRevision: 93c42725d4a99ee29033384ead3d78c9c62e1de5
    path: Deployment/Helm/Dutchr
    helm:
      releaseName: dutchr
      parameters:
      - name: frontend.image.repository
        value: ghcr.io/nitish-iiitd/dutchr-frontend-v2
        forceString: true
      - name: frontend.image.tag
        value: sha-93c42725d4a99ee29033384ead3d78c9c62e1de5
        forceString: true
      - name: backend.image.repository
        value: ghcr.io/nitish-iiitd/dutchr-backend
        forceString: true
      - name: backend.image.tag
        value: sha-93c42725d4a99ee29033384ead3d78c9c62e1de5
        forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
