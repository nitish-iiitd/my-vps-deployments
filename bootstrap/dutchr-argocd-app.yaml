apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dutchr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nitish-iiitd/dutchr.git
    targetRevision: d6585c82c0b28cd1f984877531d4eebef5d5ce48
    path: Deployment/Helm/Dutchr
    helm:
      releaseName: dutchr
      parameters:
      - name: backend.assistantProvider
        value: gemini
      - name: backend.geminiModel
        value: gemini-3.5-flash-lite
      - name: frontend.image.repository
        value: ghcr.io/nitish-iiitd/dutchr-frontend-v2
        forceString: true
      - name: frontend.image.tag
        value: sha-d6585c82c0b28cd1f984877531d4eebef5d5ce48
        forceString: true
      - name: backend.image.repository
        value: ghcr.io/nitish-iiitd/dutchr-backend
        forceString: true
      - name: backend.image.tag
        value: sha-d6585c82c0b28cd1f984877531d4eebef5d5ce48
        forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
