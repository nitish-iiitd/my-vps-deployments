apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dutchr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nitish-iiitd/dutchr.git
    targetRevision: 0a4ac8a5c9aa7b22c39faab2a4b43c82aa900df8
    path: Deployment/Helm/Dutchr
    helm:
      releaseName: dutchr
      parameters:
      - name: frontend.image.repository
        value: ghcr.io/nitish-iiitd/dutchr-frontend-v2
        forceString: true
      - name: frontend.image.tag
        value: sha-0a4ac8a5c9aa7b22c39faab2a4b43c82aa900df8
        forceString: true
      - name: backend.image.repository
        value: ghcr.io/nitish-iiitd/dutchr-backend
        forceString: true
      - name: backend.image.tag
        value: sha-0a4ac8a5c9aa7b22c39faab2a4b43c82aa900df8
        forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
