apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-alloy
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: "*"
      helm:
        releaseName: alloy
        valueFiles:
          - $values/observability/alloy-values.yaml
    - repoURL: https://github.com/nitish-iiitd/my-vps-deployments.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: obs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true