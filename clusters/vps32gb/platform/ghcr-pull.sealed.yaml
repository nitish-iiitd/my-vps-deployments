# Login for pulling private images from ghcr.io/nitish-iiitd (same token as vps8gb's ghcr-pull).
# Apps use it with  imagePullSecret: ghcr-pull  in their values.yaml. Encrypted; only this cluster can read it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: apps
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-pull
      namespace: apps
    type: kubernetes.io/dockerconfigjson
