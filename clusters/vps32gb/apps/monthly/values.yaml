# Monthly budgeting app (repo: nitish-iiitd/monthly). All options: charts/app/values.yaml
image: ghcr.io/nitish-iiitd/monthly
tag: sha-FIRST-BUILD   # set by monthly's CI
port: 8000
domain: monthly.apps.nitishsrivastava.dev
healthPath: /api/health

env:
  MONTHLY_ENV: production
  MONTHLY_EMAIL_FROM: "Monthly <login@monthly.apps.nitishsrivastava.dev>"   # domain verified in Resend
  MONTHLY_CORS_ORIGINS: https://monthly.apps.nitishsrivastava.dev

secrets:
  # Postgres on this cluster (database + user 'monthly', see clusters/vps32gb/databases).
  MONTHLY_DATABASE_URL: 
  MONTHLY_SESSION_SECRET: 
  RESEND_API_KEY: 
