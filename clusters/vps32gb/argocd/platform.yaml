# Small cluster-wide settings in ../platform: Let's Encrypt issuer, Argo CD's own web address.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nitish-iiitd/my-vps-deployments.git
    targetRevision: main
    path: clusters/vps32gb/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The issuer needs cert-manager installed first; keep retrying until it is.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 30s
        maxDuration: 5m
