{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "triply.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "triply.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ include "triply.fullname" . }}-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "triply.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          # MCP endpoint + OAuth discovery are served by the backend at the root
          # (not under /api), so they need explicit routes. The two well-known
          # paths are listed individually to avoid capturing
          # /.well-known/acme-challenge used by cert-manager.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "triply.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: {{ include "triply.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: {{ include "triply.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "triply.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
