backend:
  replicaCount: 1
  image:
    repository: nitish2794/triply-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  env:
    otelServiceName: "triply-backend"
    otelExporterOtlpEndpoint: "http://alloy.observability.svc.cluster.local:4318"

frontend:
  replicaCount: 1
  image:
    repository: nitish2794/triply-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080

ingress:
  enabled: true
  className: "nginx"
  host: triply.projects.nitishsrivastava.dev
